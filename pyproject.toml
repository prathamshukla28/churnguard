[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churnguard"
version = "1.0.0"
description = "End-to-end customer churn prediction service (ML pipeline + FastAPI)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "shap>=0.44",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.5",
    "mlflow>=2.9",
]

[tool.setuptools.packages.find]
include = ["churnguard*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["churnguard"]
omit = ["churnguard/_demo.py"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["tests/"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# evaluate.py sets the matplotlib backend before importing pyplot (E402) and
# uses compact one-line plotting helpers (E702).
"churnguard/evaluate.py" = ["E402", "E702"]
# _demo.py is a single embedded HTML/CSS template string; line length is moot.
"churnguard/_demo.py" = ["E501"]
