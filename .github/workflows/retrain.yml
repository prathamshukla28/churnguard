name: Scheduled retrain

# Honest scope: training is seeded, so retraining on unchanged data reproduces
# the same model. scripts/retrain.py fingerprints the dataset and exits early
# ("skipped") when it matches the data the current champion was trained on. With
# the static public Telco snapshot this job will normally skip; it becomes useful
# once data.raw_path / data.real_url point at a refreshed customer extract (update
# data.real_sha256 too). When it does train, a challenger that regresses vs. the
# committed baseline fails the job; a better one is uploaded for human review.
# Promotion to the deployed service and `make promote-baseline` stay manual.

on:
  schedule:
    - cron: "0 3 1 * *"   # 03:00 UTC on the 1st of each month
  workflow_dispatch:
    inputs:
      force:
        description: "Retrain even if the data is unchanged"
        type: boolean
        default: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install pinned runtime dependencies
        run: pip install -r requirements.lock

      - name: Retrain (skips if data unchanged; fails on regression)
        env:
          CHURNGUARD_TRACKING: "0"
        run: python scripts/retrain.py ${{ inputs.force && '--force' || '' }}

      - name: Upload the retrained model and reports (if a model was produced)
        uses: actions/upload-artifact@v4
        with:
          name: churnguard-model-${{ github.run_number }}
          path: |
            models/churnguard.joblib
            reports/metrics.json
            reports/model_card.md
          if-no-files-found: ignore
          retention-days: 90
