name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # 3.12: the exact pinned environment (same lock family as the Docker image).
          - python-version: "3.12"
            requirements: requirements-dev.lock
          # 3.10: the declared lower-bound ranges, to keep the minimum supported version honest.
          - python-version: "3.10"
            requirements: requirements-dev.txt

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.requirements }}

      - name: Lint + format (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check (mypy)
        run: mypy churnguard

      - name: Run tests with coverage (synthetic data, offline)
        env:
          CHURNGUARD_TRACKING: "0"
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  real-data-pipeline:
    # Trains once on the real Telco data, evaluates the saved artifact, and
    # gates it against the frozen, committed baseline (never rewritten by CI).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - name: Download, train, evaluate
        env:
          CHURNGUARD_TRACKING: "0"
        run: |
          cp reports/baseline_metrics.json /tmp/baseline_before.json
          python scripts/download_data.py
          python -m churnguard.train
          python -m churnguard.evaluate
          test -f models/churnguard.joblib
          test -f reports/metrics.json
          test -f reports/reference_profile.json
          # evaluate must never touch the committed baseline
          cmp reports/baseline_metrics.json /tmp/baseline_before.json

      - name: Model-regression gate (vs. committed baseline)
        env:
          CHURNGUARD_TRACKING: "0"
        run: python scripts/check_regression.py
