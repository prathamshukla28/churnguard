# ChurnGuard configuration
# All paths are relative to the project root.

seed: 42

data:
  raw_path: data/churn.csv
  n_rows: 7043            # matches the real Telco Customer Churn dataset size
  test_size: 0.2
  target: Churn

features:
  # Columns treated as numeric (scaled). Everything else categorical (one-hot).
  numeric:
    - tenure
    - MonthlyCharges
    - TotalCharges
    - num_addon_services       # engineered
    - charges_per_tenure       # engineered
  # Columns dropped before modelling (identifiers / leakage risk).
  drop:
    - customerID

model:
  # Candidate estimators compared by cross-validated ROC-AUC. Best one is saved.
  candidates:
    - logistic_regression
    - random_forest
    - gradient_boosting
  cv_folds: 5
  scoring: roc_auc

artifacts:
  model_path: models/churnguard.joblib
  metrics_path: reports/metrics.json
  model_card_path: reports/model_card.md
  figures_dir: reports/figures
