# ChurnGuard configuration
# All paths are relative to the project root.

seed: 42

data:
  # Which dataset trains/evaluates the model:
  #   real      - the public IBM Telco Customer Churn CSV (the default). Downloaded
  #               on first use (or via `make data-real`) and verified by SHA-256.
  #   synthetic - a generated stand-in whose label comes from a hand-written
  #               logistic formula. ONLY for fast, offline unit tests: a model
  #               trained on it just recovers that formula, so its metrics and
  #               "drivers" say nothing about real churn.
  source: real
  raw_path: data/telco_churn.csv
  synthetic_path: data/synthetic_churn.csv
  n_rows: 7043            # synthetic only: size of the generated set
  test_size: 0.2          # held-out test split; touched exactly once, by evaluate
  target: Churn
  real_url: https://raw.githubusercontent.com/IBM/telco-customer-churn-on-icp4d/master/data/Telco-Customer-Churn.csv
  # SHA-256 of the file at real_url; a mismatch aborts the download.
  real_sha256: 16320c9c1ec72448db59aa0a26a0b95401046bef5d02fd3aeb906448e3055e91

features:
  # Columns treated as numeric (scaled). Everything else categorical (one-hot).
  numeric:
    - tenure
    - MonthlyCharges
    - TotalCharges
    - num_addon_services       # engineered
    - charges_per_tenure       # engineered
  # Columns dropped before modelling (identifiers / leakage risk).
  drop:
    - customerID

model:
  # Candidate estimators compared by cross-validated ROC-AUC, listed from the
  # simplest / cheapest to serve to the most complex.
  #   selection_rule: best               -> highest mean CV score wins
  #   selection_rule: one_standard_error -> the SIMPLEST candidate whose mean is
  #     within one standard error of the best (Breiman's 1-SE rule). On Telco the
  #     three candidates differ by ~0.003 AUC, far inside fold noise, and the
  #     calibrated forest is ~15x slower to serve.
  selection_rule: one_standard_error
  candidates:
    - logistic_regression
    - random_forest
    - gradient_boosting
  cv_folds: 5
  scoring: roc_auc
  tuning:
    enabled: true           # randomized hyper-parameter search on the winner
    n_iter: 15
  calibration:
    enabled: true           # wrap the model so predicted probabilities are honest
    method: isotonic        # isotonic | sigmoid

threshold:
  # The decision threshold is chosen to minimise business cost, not left at 0.5.
  # A missed churner (false negative) typically costs more than a wasted
  # retention offer (false positive). It is selected on OUT-OF-FOLD predictions
  # over the training split only; the test split never influences it.
  cost_fn: 5
  cost_fp: 1

artifacts:
  model_path: models/churnguard.joblib
  metrics_path: reports/metrics.json
  model_card_path: reports/model_card.md
  figures_dir: reports/figures
  reference_path: reports/reference_profile.json   # drift-monitoring baseline
  # CI quality floor. Frozen and committed: only `make promote-baseline` writes it.
  baseline_path: reports/baseline_metrics.json

monitoring:
  # Population Stability Index (PSI) bands — the industry standard for churn/credit.
  # < warn: stable | warn..alert: moderate drift | > alert: significant drift.
  psi_warn: 0.1
  psi_alert: 0.25
  # Alert if live ROC-AUC drops this far below the baseline (labels required).
  performance_drop_warn: 0.03
  performance_drop_alert: 0.05

registry:
  dir: models/registry
  promotion_metric: roc_auc        # champion/challenger comparison metric
  # Challenger must beat the champion by >= this to auto-promote. The champion is
  # the local registry's production entry, else the committed baseline metrics.
  min_improvement: 0.0
  regression_tolerance: 0.02       # CI fails if metrics regress beyond this vs the baseline

serving:
  # Requests/minute per client IP for /predict and /monitor; 0 disables.
  # Override at runtime with CHURNGUARD_RATE_LIMIT. API-key auth turns on when
  # the CHURNGUARD_API_KEY environment variable is set (sent as X-API-Key).
  rate_limit_per_minute: 120
  # Upper bound on distinct clients the limiter tracks at once (memory guard).
  rate_limit_max_clients: 10000
  # Only trust X-Forwarded-For when the service sits behind a proxy you control
  # (Render, a load balancer). Otherwise any client could spoof its rate-limit
  # key. Override with CHURNGUARD_TRUST_PROXY=1. `trusted_proxy_hops` is how many
  # proxies append to the header; the client is that many entries from the right.
  trust_forwarded_for: false
  trusted_proxy_hops: 1
  # Require the API key for the operational endpoints (/metrics,
  # /metrics/prometheus, /stats) too. Override with CHURNGUARD_PROTECT_OPS=1.
  protect_ops_endpoints: false
  # Risk bands are tied to the decision threshold so they never contradict
  # `will_churn`: low = below the threshold (no action); medium = at/above it;
  # high = calibrated probability >= this value (more likely than not to churn).
  high_risk_probability: 0.5
